name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to a PR cancels that PR's run still in progress; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # The longest leg is 3.12's unit tests, 12-18 min by 2026-11 (the full suite
    # moved to `tests`). Without a limit a compile that never finishes holds the
    # runner for GitHub's 6 h maximum.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # jax>=0.8 (a hard dependency) requires Python >=3.11, so 3.10 cannot
        # resolve the dependency set; and the dev toolchain pins jax 0.11.2
        # (pyproject.toml), which requires Python >=3.12, so 3.11 cannot install it.
        # Test the interpreters the pinned toolchain supports.
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        # The `applications` extra carries optax, which
        # yggdrax/applications/svgd/bandwidth_learning imports. Without it basedpyright cannot resolve the import and the
        # type-check step fails before the tests ever run.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,applications]"

      - name: Black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: pydoclint (public API surface)
        run: |
          pydoclint \
            yggdrax/__init__.py \
            yggdrax/bounds.py \
            yggdrax/dtypes.py \
            yggdrax/geometry.py \
            yggdrax/interactions.py \
            yggdrax/morton.py \
            yggdrax/traversal.py \
            yggdrax/tree.py \
            yggdrax/tree_moments.py \
            yggdrax/types.py

      - name: basedpyright (static type check)
        # Config + baseline are in pyproject.toml / .basedpyright/baseline.json.
        # The gate enforces "no new type errors" over the committed baseline.
        run: basedpyright yggdrax

      # The full suite, with the coverage gate, runs on 3.13 in the `tests` shards
      # and the `coverage` job below. 3.12 runs the unit tests only, without
      # coverage: it is there to catch an interpreter incompatibility, not to
      # repeat every test.
      - name: Unit tests
        if: matrix.python-version != '3.13'
        run: pytest tests/unit --no-cov

      - name: Tree backend smoke script
        run: python examples/kdtree_jaccpot_smoke.py --n-points 512 --leaf-size 16 --seed 0

      - name: Build documentation
        run: |
          pip install -e ".[docs]"
          python -m sphinx -b html docs docs/_build/html

  tests:
    # The full suite on 3.13, split across parallel shards. Run as one `pytest` it
    # took 54-79 min by 2026-11 (tests/applications ~28, tests/unit ~15,
    # tests/distributed ~12 on one device). Each shard measures coverage over all
    # of yggdrax and uploads its data file; the `coverage` job combines them and
    # applies the 80 % gate, so the gate means what it meant for the single run.
    #
    # The shards partition the suite, and each one but `applications-corrfunc`
    # is defined by what it leaves out, so a new test file always lands in some
    # shard: tests/applications/* in `applications-other`, anything outside
    # tests/applications and tests/unit in `rest`. Adding or renaming a shard:
    # update SHARDS in the `coverage` job too, which fails until they match.
    #
    # Test time per shard, summed from per-file times on a 10-core Mac
    # (2026-11-12, CI's jax pins) and from the 2026-11-11 runner logs (the runner
    # is 1.3-1.6x slower, and ~5x on the Pallas SVGD near field):
    #
    #     applications-corrfunc   ~11 min local, ~13 on the runner
    #     applications-other      ~11 min local, ~17-19 on the runner
    #                             (test_positions ~4 of it)
    #     unit                    ~11 min local, ~15 on the runner
    #     rest                    ~14 min local, ~17-21 on the runner
    #                             (tests/distributed on one device, of it
    #                             test_distributed_stats_streaming ~5; tests/*.py)
    #
    # The run's wall time is set by `distributed-tier` (~25 min), so balancing
    # these further would not shorten it.
    #
    # Shards are processes on separate runners, not pytest-xdist workers: one
    # process of tests/applications peaked at 12 GB locally, a single process of
    # the distributed stats tests has reached 10 GB, and the runner has 16 GB.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: applications-corrfunc
            paths: >-
              tests/applications/test_corrfunc_*.py
          - shard: applications-other
            paths: >-
              tests/applications
              --ignore-glob='tests/applications/test_corrfunc_*.py'
          - shard: unit
            paths: >-
              tests/unit
          - shard: rest
            paths: >-
              tests
              --ignore=tests/applications
              --ignore=tests/unit
    name: tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Each shard is ~13-21 min of tests plus ~1.5 min of setup on the runner;
    # 45 leaves room for a runner 1.5x slower than usual, as seen in 2026-11.
    timeout-minutes: 45
    env:
      COVERAGE_FILE: .coverage.${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,applications]"
      - name: Tests (${{ matrix.shard }})
        # `--cov-fail-under=0` turns off the per-process gate from `addopts`: one
        # shard covers only part of yggdrax. The gate runs on the combined data in
        # the `coverage` job. The coverage report this step prints is the shard's
        # alone.
        run: pytest ${{ matrix.paths }} --cov-fail-under=0
      - name: Upload coverage data
        # Also after a test failure, so the `coverage` job can still report; it
        # fails on its own when a shard's file is missing.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          # upload-artifact skips dotfiles unless told otherwise
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    # The combined coverage gate for the `tests` shards.
    needs: tests
    # Runs when a shard failed too, so a coverage drop is reported alongside the
    # failure; a shard that uploaded nothing fails the check below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # One per `tests` shard. The check below fails if the uploaded files differ.
      SHARDS: applications-corrfunc applications-other unit rest
    steps:
      - name: Checkout
        # `coverage report` reads the sources, and pyproject.toml for its config
        # (omit list, `fail_under = 80`).
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install coverage
        run: |
          python -m pip install --upgrade pip
          pip install "coverage>=7.10.6"
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data
      - name: Check every shard reported
        # download-artifact succeeds with whatever matched the pattern, so a
        # missing shard would otherwise make the gate measure part of the suite.
        run: |
          ls -la coverage-data
          expected=$(for s in $SHARDS; do echo ".coverage.$s"; done | sort)
          found=$(ls -A coverage-data | sort)
          if [ "$expected" != "$found" ]; then
            echo "::error::coverage data does not match the shards"
            echo "expected:"; echo "$expected"
            echo "found:"; echo "$found"
            exit 1
          fi
      - name: Combine
        id: combine
        run: coverage combine coverage-data
      - name: Coverage gate
        # The same 80 % as `--cov-fail-under` in pyproject.toml's `addopts`, over
        # the same files (`[tool.coverage.run]` there: source and omit list).
        run: coverage report --fail-under=80
      - name: Coverage XML
        # Also when the gate failed, to read what dropped.
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        run: coverage xml
      - name: Upload coverage XML artifact
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        # The report is kept for reading only; the gate ran in the step above.
        # An artifact-service outage (2026-11-11) must not fail a passing suite.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  jaccpot-compat:
    # jaccpot installs yggdrax from main, so a removal it still imports used to
    # break jaccpot's CI only after it had landed here. This collects jaccpot
    # main's test suite against THIS yggdrax: jaccpot's conftest aborts collection
    # when a yggdrax name its library imports is missing, and collecting imports
    # every test module. It runs no jaccpot test, and it cannot see a keyword
    # argument jaccpot passes that yggdrax dropped.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout jaccpot main
        uses: actions/checkout@v4
        with:
          repository: TobiBu/jaccpot
          ref: main
          path: jaccpot
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install this yggdrax, then jaccpot over it
        # yggdrax first: jaccpot's `yggdrax>=0.0.1,<0.1.0` is then already met by
        # this checkout, so pip keeps it rather than fetching another.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e "./jaccpot[dev]"
          python -c "import yggdrax, jaccpot; print(yggdrax.__file__); print(jaccpot.__file__)"
      - name: Collect jaccpot's tests against this yggdrax
        working-directory: jaccpot
        run: python -m pytest --collect-only -q -o addopts="" tests

  distributed-tier:
    # The only job with more than one device, so the only one that runs the tests in
    # tests/distributed that need a mesh. The `tests` shards above run the whole
    # suite on one CPU device: there these files skip, and the device-independent ones
    # (the cross walks, export walks, receiver lists, summaries, the local-tree
    # backends) pass. Those are deliberately NOT repeated here.
    #
    # `--xla_force_host_platform_device_count=4` fakes four CPU devices. NOT a
    # substitute for real multi-GPU -- NCCL is not exercised on host-platform devices --
    # but it is what makes the collectives run at all.
    #
    # Until the 2026-10 cleanup (Y3) this tier took 25-52 min per shard. The long poles
    # were the mesh drivers' fixtures (`test_let`'s ~1240 s, the octree
    # `test_local_tree_backends` ~1292 s plus ~2400 s of setup), and the drivers had no
    # caller outside the tests. Y3 removed them and added the four files that needed a
    # mesh but were in no shard, so CI had never run them: `test_halo_payload`,
    # `test_import_cells`, `test_partition_payload` and `test_sfc_repartition` (jaccpot
    # calls `sfc_repartition`). Measured per file on a loaded workstation, 4 fake
    # devices (2026-10-11), in seconds:
    #
    #     exchanges   comm 14, reverse_halo 21, partition 83, partition_payload 8,
    #                 sfc_repartition 8, import_cells 5, classify 124,
    #                 coarse_tree_extents 25                          ~290 s
    #     let         import 149, frontier_payload 187, halo_payload 292   ~630 s
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: exchanges
            paths: >-
              tests/distributed/test_comm.py
              tests/distributed/test_reverse_halo.py
              tests/distributed/test_partition.py
              tests/distributed/test_partition_payload.py
              tests/distributed/test_sfc_repartition.py
              tests/distributed/test_import_cells.py
              tests/distributed/test_classify.py
              tests/distributed/test_coarse_tree_extents.py
          - shard: let
            paths: >-
              tests/distributed/test_import.py
              tests/distributed/test_frontier_payload.py
              tests/distributed/test_halo_payload.py
          - shard: stats
            paths: >-
              tests/distributed/test_distributed_stats.py
              tests/distributed/test_distributed_stats_grad.py
              tests/distributed/test_distributed_stats_exchange.py
              tests/distributed/test_distributed_stats_subblock.py
          # A shard of its own: in one process with the files above it peaked at
          # 10 GB on macOS, and XLA's compiler aborted on the 16 GB runner,
          # most likely for lack of memory.
          - shard: streaming
            paths: >-
              tests/distributed/test_distributed_stats_streaming.py
    name: distributed-tier (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      JAX_PLATFORMS: cpu
      XLA_FLAGS: --xla_force_host_platform_device_count=4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + dev tools
        # The `applications` extra carries optax, which
        # yggdrax/applications/svgd/bandwidth_learning imports. Without it basedpyright cannot resolve the import and the
        # type-check step fails before the tests ever run.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,applications]"
      - name: Distributed tests (${{ matrix.shard }})
        # `--no-cov`: `addopts` carries `--cov-fail-under=80`, and these paths only
        # touch `yggdrax/distributed/*`, which the coverage config omits -- so the gate
        # would measure a near-empty report against 80 and fail for a reason unrelated
        # to the tests. `-rs` prints skip reasons for the next step to read.
        run: |
          set -o pipefail
          pytest ${{ matrix.paths }} --no-cov -rs -v | tee pytest-shard.txt
      - name: Fail if the shard was skipped rather than run
        # A skipped suite PASSES, and green-but-vacuous is the state this job exists to
        # end. Keyed on DEVICE-related skip reasons rather than on any skip, because the
        # tier has legitimate ones (`test_reverse_halo` guards on `shard_map` being
        # importable) and a blanket rule would fail for the wrong reason. The second
        # check catches a collection error that skips everything without a reason line.
        run: |
          if grep -qiE "^SKIPPED.*device" pytest-shard.txt; then
            echo "::error::${{ matrix.shard }} skipped for a DEVICE reason -- it ran on one device, so it tested nothing"
            grep -iE "^SKIPPED.*device" pytest-shard.txt | head -5
            exit 1
          fi
          if ! grep -qE "[0-9]+ passed" pytest-shard.txt; then
            echo "::error::no test passed in ${{ matrix.shard }}; the shard did not run"
            exit 1
          fi
